name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  the-mercy-seat-success:
    name: the-mercy-seat-success
    runs-on: ubuntu-latest
    needs:
      - build
      - lint
    if: always()
    steps:
      - name: Verify required checks passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            exit 1
          fi
      - name: Report success
        run: echo "Build and test checks passed."

  deploy:
    name: Deploy to Azure Static Web Apps
    needs:
      - the-mercy-seat-success
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.the-mercy-seat-success.result == 'success'
    uses: ./.github/workflows/azure-static-web-apps-yellow-stone-07cd5820f.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
