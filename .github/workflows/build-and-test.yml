name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  the-mercy-seat-success:
    name: the-mercy-seat-success
    runs-on: ubuntu-latest
    needs:
      - build
      - lint
    if: always()
    steps:
      - name: Require build
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
      - name: Require lint
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint did not succeed: ${{ needs.lint.result }}"
            exit 1
          fi
      - name: Report success
        run: echo "Build and lint checks passed."
