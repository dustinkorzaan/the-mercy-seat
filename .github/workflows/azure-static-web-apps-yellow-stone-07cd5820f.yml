name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  wait_for_the_mercy_seat_success:
    name: Wait for the-mercy-seat-success
    runs-on: ubuntu-latest
    steps:
      - name: Wait for required check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          max_attempts = 60  # 60 attempts × 10 seconds = 10 minutes max wait
          sleep_seconds = 10
          url = f"https://api.github.com/repos/{repository}/commits/{sha}/check-runs?per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def next_link(link_header):
              if not link_header:
                  return None
              match = re.search(r'<([^>]+)>;\s*rel="next"', link_header)
              return match.group(1) if match else None

          def fetch_check_runs():
              runs = []
              next_url = url

              while next_url:
                  request = urllib.request.Request(next_url, headers=headers)
                  with urllib.request.urlopen(request) as response:
                      payload = json.load(response)
                      runs.extend(payload.get("check_runs", []))
                      next_url = next_link(response.headers.get("Link"))

              return runs

          for attempt in range(max_attempts):
              try:
                  check_runs = fetch_check_runs()
              except (urllib.error.HTTPError, urllib.error.URLError) as error:
                  if isinstance(error, urllib.error.HTTPError) and 400 <= error.code < 500 and error.code != 429:
                      print(f"Non-retryable API error: {error}")
                      sys.exit(1)
                  print(f"Attempt {attempt + 1} failed: {error}")
                  time.sleep(sleep_seconds)
                  continue

              matches = [
                  run for run in check_runs
                  if run.get("name") == "the-mercy-seat-success"
              ]

              if matches:
                  pending = [run for run in matches if run.get("status") != "completed"]
                  if pending:
                      print("Required check is still running.")
                      time.sleep(sleep_seconds)
                      continue

                  completed = [run for run in matches if run.get("status") == "completed"]
                  latest_completed = max(
                      completed,
                      key=lambda run: run.get("completed_at") or run.get("started_at") or "",
                  )
                  conclusion = latest_completed.get("conclusion")

                  if conclusion == "success":
                      print("Required check passed.")
                      sys.exit(0)
                  print(f"Required check concluded with {conclusion}.")
                  sys.exit(1)

              time.sleep(sleep_seconds)

          print("Timed out waiting for the-mercy-seat-success.")
          sys.exit(1)
          PY

  build_and_deploy_job:
    needs:
      - wait_for_the_mercy_seat_success
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_STONE_07CD5820F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "." # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
