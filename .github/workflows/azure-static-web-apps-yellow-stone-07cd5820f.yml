name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  wait_for_the_mercy_seat_success:
    name: Wait for the-mercy-seat-success
    runs-on: ubuntu-latest
    steps:
      - name: Wait for required check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          max_attempts = 60  # 60 attempts × 10 seconds = 10 minutes max wait
          sleep_seconds = 10
          url = f"https://api.github.com/repos/{repository}/commits/{sha}/check-runs"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }

          for attempt in range(max_attempts):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError) as error:
                  print(f"Attempt {attempt + 1} failed: {error}")
                  time.sleep(sleep_seconds)
                  continue

              matches = [
                  run for run in payload.get("check_runs", [])
                  if run.get("name") == "the-mercy-seat-success"
              ]

              if matches:
                  latest = max(matches, key=lambda run: run.get("started_at") or "")
                  status = latest.get("status")
                  conclusion = latest.get("conclusion")

                  if status == "completed":
                      if conclusion == "success":
                          print("Required check passed.")
                          sys.exit(0)
                      print(f"Required check concluded with {conclusion}.")
                      sys.exit(1)

              time.sleep(sleep_seconds)

          print("Timed out waiting for the-mercy-seat-success.")
          sys.exit(1)
          PY

  build_and_deploy_job:
    needs:
      - wait_for_the_mercy_seat_success
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_STONE_07CD5820F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "." # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
