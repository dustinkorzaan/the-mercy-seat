name: Azure Static Web Apps CI/CD

# Production only. Called from Build and Test after the-mercy-seat-success on main.
on:
  workflow_call:
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_STONE_07CD5820F:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      DEPLOYMENT_PROVIDER: Custom
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      BRANCH: main
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_STONE_07CD5820F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "." # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          production_branch: main
          ###### End of Repository/Build Configurations ######
